spec_id: SPEC-local-vector-backend-1
title: "Offline Vector Backend (FastEmbed + SQLite)"
given_when_then:
  - given: "VECTOR_BACKEND=local and no network access"
    when: "DocumentProcessor matches a document title"
    then: "FastEmbed paraphrase-multilingual-MiniLM-L12-v2 embeddings rank candidates from SQLite + sqlite-vec with cosine semantics"
  - given: "A service requests similarity results"
    when: "LocalVectorService executes a vec0 KNN query"
    then: "Results filter by the shared similarity threshold and dedupe exactly like SupabaseService"
  - given: "The DB file was built with another embedding dimension"
    when: "LocalVectorService opens it"
    then: "Startup fails fast with a reindex hint instead of mixing vector spaces"
  - given: "VECTOR_BACKEND is unset or invalid"
    when: "config.get_vector_backend() runs"
    then: "The supabase backend stays active so existing deployments are unchanged"
acceptance_tests:
  - id: TEST-local-vector-1
    desc: "LocalEmbeddingService returns L2-normalized 384-dim vectors with cache and batch support, no network"
  - id: TEST-local-vector-2
    desc: "LocalVectorService CRUD, threshold-filtered recommend, dedup parity, pagination, and deletion match SupabaseService semantics"
  - id: TEST-local-vector-3
    desc: "Real-model E2E ranks Korean paraphrases above unrelated titles with similarities in [-1, 1]"
dependencies:
  - governance: "env.yaml"
  - governance: "memory.md"
linked_tasks:
  - TASK-103

runtime:
  python: "3.12+"
  package_manager: "uv"
  rpa_stack: "pywinauto on Windows"
services:
  openai:
    model: "text-embedding-3-small (1536 dims)"
    env_vars:
      - OPENAI_API_KEY
  supabase:
    tables:
      - reception_documents
      - task_cards
      - document_embeddings
    env_vars:
      - SUPABASE_URL
      - SUPABASE_KEY
      - SUPABASE_SERVICE_ROLE_KEY
  local_caches:
    chroma_backup_dir: "./data/backup/"
    embedding_cache: ".cache/"
tooling:
  lint: "uv run pylint src/"
  tests:
    - "uv sync --group dev"
    - "pytest tests/unit/ -v"
    - "pytest tests/ --cov=src --cov-report=html"
commands:
  run_standard: "uv run ./src/main.py"
  run_interactive: "uv run ./src/main.py --interactive"
  run_delete: "uv run ./src/main.py --delete"

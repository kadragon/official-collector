repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black
        language: system
        files: \.(py)$
        args: [--check, --diff]

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        files: \.(py)$
        args: [--explicit-package-bases, src/]
        pass_filenames: false

      - id: pylint
        name: pylint
        entry: uv run pylint
        language: system
        files: \.(py)$
        args: [src/]
        pass_filenames: false

      - id: bandit
        name: bandit
        entry: uv run bandit
        language: system
        files: \.(py)$
        args: [-r, src/]
        pass_filenames: false
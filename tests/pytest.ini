[tool:pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (requires external services)
    performance: Performance tests (run separately)
    slow: Slow tests (longer execution time)

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --durations=10
    
# Test execution
minversion = 6.0
testmon = false

# Coverage settings (when using --cov)
# Usage: pytest --cov=src --cov-report=html --cov-report=term
# Example: pytest tests/unit --cov=src --cov-report=html --cov-report=term

[coverage:run]
source = src
omit =
    # Exclude non-testable pywinauto automation code
    src/services/official_service.py
    # Exclude debug tools (development only)
    src/debug/*
    # Exclude main entry points (coordination code only)
    src/main.py
    src/delete_data.py
    # Exclude test files themselves
    tests/*
    
[coverage:report]
# Coverage reporting settings
exclude_lines =
    pragma: no cover
    def __repr__
    if __name__ == .__main__.:
    raise AssertionError
    raise NotImplementedError
    if 0:
    if False:

# Minimum coverage thresholds
precision = 2
show_missing = true
skip_covered = false

[coverage:html]
directory = htmlcov
title = Official Collector Test Coverage

[coverage:paths]
source = 
    src/
    */site-packages/
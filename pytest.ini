[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    integration: Integration tests requiring external services (Chroma)
    performance: Performance and stress tests (may take longer to run)
    unit: Unit tests (fast, isolated tests)
    slow: Tests that take longer than 10 seconds
    requires_data: Tests requiring test data files

# Output and reporting
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10
    --showlocals

# Test execution timeout (5 minutes)
timeout = 300
timeout_method = thread

# Filtering options
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:chromadb.*

# Logging configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Minimum version
minversion = 6.0
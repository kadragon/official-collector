[project]
name = "official-collector"
version = "0.1.0"
description = "This project automates the classification and processing of official documents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyperclip>=1.9.0",
    "pywinauto>=0.6.9",
    "langchain-community",
    "langchain-core",
    "langchain-openai",
    "langchain-ollama",
    "langchain-chroma",
    "chromadb",
]

[dependency-groups]
dev = [
    "pylint>=3.3.7",
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

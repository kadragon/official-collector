[project]
name = "official-collector"
version = "0.1.0"
description = "This project automates the classification and processing of official documents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyperclip>=1.11.0",
    "pywinauto>=0.6.9",
    "langchain-community",
    "langchain-core",
    "supabase>=2.31.0",
    "openai>=2.41.1",
    "python-dotenv>=1.2.2",
    "pywin32>=312",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "black>=26.5.1",
    "mypy>=2.1.0",
    "pylint>=4.0.6",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]

[tool.uv]
constraint-dependencies = [
    "pyjwt>=2.13.0",
    "pygments>=2.20.0",
    "langsmith>=0.8.0",
    "langchain-classic>=1.0.7",
    "aiohttp>=3.14.1",
    "cryptography>=48.0.1",
]

[tool.pyright]
extraPaths = ["src"]

[tool.mypy]
python_version = "3.12"
namespace_packages = true
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "src.*",
    "tests.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "pywinauto",
    "pywinauto.*",
    "win32gui",
    "win32con",
    "pyperclip",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
